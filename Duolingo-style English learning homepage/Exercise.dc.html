<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F5FF; }
    * { box-sizing: border-box; }
    a { color: #6C4FF6; text-decoration: none; }
    a:hover { color: #5539E0; }
  </style>
</helmet>

<div style="font-family: 'Inter', sans-serif; background: #F7F5FF; color: #1E1B2E; min-height: 100vh;">

  <div style="background: #6C4FF6; padding: 20px 24px;">
    <div style="max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 14px;">
      <a href="Stage Lessons.dc.html?stage=1" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3L5 9L11 15" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div>
        <div style="font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.75); letter-spacing: 0.04em;">STAGE {{ stageNumber }} · EXERCISE</div>
        <div style="font-weight: 700; font-size: 16px; color: white;">Question {{ qNumber }} of {{ qTotal }}</div>
      </div>
      <a href="Stage Lessons.dc.html?stage=1" style="margin-left: auto; background: rgba(255,255,255,0.18); color: white; border-radius: 10px; padding: 9px 16px; font-weight: 700; font-size: 13px; flex-shrink: 0;">Go to lessons</a>
    </div>
    <div style="max-width: 640px; margin: 14px auto 0; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.25); overflow: hidden;">
      <div style="height: 100%; border-radius: 999px; background: #FFD976; width: {{ progressPct }}%; transition: width 0.3s;"></div>
    </div>
  </div>

  <div style="max-width: 640px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 24px;">
    <div style="background: white; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 22px;">
      <h2 style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; margin: 0; line-height: 1.4;">{{ currentQuestion.prompt }}</h2>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <sc-for list="{{ currentQuestion.options }}" as="opt" hint-placeholder-count="3">
          <button onClick="{{ opt.onSelect }}" style="text-align: left; background: {{ opt.bg }}; border: 2px solid {{ opt.border }}; border-radius: 14px; padding: 16px 20px; font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; color: {{ opt.color }};">{{ opt.label }}</button>
        </sc-for>
      </div>

      <sc-if value="{{ showFeedback }}" hint-placeholder-val="{{ false }}">
        <div style="background: {{ feedbackBg }}; border: 1px solid {{ feedbackBorder }}; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
          <p style="margin: 0; font-size: 15px; line-height: 1.6; font-weight: 700; color: {{ feedbackColor }};">{{ feedbackText }}</p>
          <button onClick="{{ onNext }}" style="align-self: flex-end; background: #6C4FF6; color: white; border: none; border-radius: 12px; padding: 12px 28px; font-weight: 700; font-size: 15px; font-family: 'Baloo 2', sans-serif; cursor: pointer;">{{ nextLabel }}</button>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{ isComplete }}" hint-placeholder-val="{{ false }}">
      <div style="background: white; border-radius: 20px; padding: 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <div style="width: 64px; height: 64px; border-radius: 50%; background: #FFF3D6; display: flex; align-items: center; justify-content: center;">
          <svg width="30" height="30" viewBox="0 0 22 22" fill="none"><path d="M5 11.5L9.5 16L17 6" stroke="#FFB800" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2 style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; margin: 0;">Exercise complete!</h2>
        <a href="Stage Lessons.dc.html?stage=1" style="background: #6C4FF6; color: white; border-radius: 14px; padding: 14px 32px; font-weight: 800; font-size: 16px; font-family: 'Baloo 2', sans-serif; box-shadow: 0 6px 0 #5539E0;">Back to lessons</a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const QUESTIONS = [
  {
    type: 'multiple-choice',
    prompt: 'Which sentence has the correct word order?',
    options: ['I rice eat', 'I eat rice', 'Rice I eat'],
    correct: 'I eat rice',
    correctFeedback: "Correct! Subject → Verb → Object — that's the English pattern.",
    incorrectFeedback: 'Not quite. In English, the verb comes right after the subject: I eat rice.',
  },
  {
    type: 'gap-fill',
    prompt: "Complete the sentence: 'We ___ English every day.'",
    options: ['watch', 'watches', 'watching'],
    correct: 'watch',
    correctFeedback: "Correct! 'We' takes the base form of the verb.",
    incorrectFeedback: 'Almost — with \'we,\' use the base verb form: We watch English every day.',
  },
];

class Component extends DCLogic {
  state = { qIndex: 0, selected: null, complete: false };

  select = (label) => {
    if (this.state.selected) return;
    this.setState({ selected: label });
  };

  next = () => {
    const nextIndex = this.state.qIndex + 1;
    if (nextIndex >= QUESTIONS.length) {
      this.setState({ complete: true });
    } else {
      this.setState({ qIndex: nextIndex, selected: null });
    }
  };

  renderVals() {
    const { qIndex, selected, complete } = this.state;
    const q = QUESTIONS[qIndex];
    const isCorrect = selected === q.correct;

    const options = q.options.map(label => {
      let bg = '#F7F5FF', border = 'transparent', color = '#1E1B2E';
      if (selected) {
        if (label === q.correct) { bg = '#E3F9EB'; border = '#3ECF6E'; color = '#1E1B2E'; }
        else if (label === selected) { bg = '#FFE9E5'; border = '#FF6B4A'; color = '#1E1B2E'; }
      }
      return { label, bg, border, color, onSelect: () => this.select(label) };
    });

    return {
      stageNumber: 1,
      qNumber: qIndex + 1,
      qTotal: QUESTIONS.length,
      progressPct: Math.round(((qIndex + (selected ? 1 : 0)) / QUESTIONS.length) * 100),
      currentQuestion: { prompt: q.prompt, options },
      showFeedback: !!selected,
      feedbackText: selected ? (isCorrect ? q.correctFeedback : q.incorrectFeedback) : '',
      feedbackBg: isCorrect ? '#E3F9EB' : '#FFE9E5',
      feedbackBorder: isCorrect ? '#3ECF6E' : '#FF6B4A',
      feedbackColor: isCorrect ? '#1F7A44' : '#B23A20',
      nextLabel: qIndex + 1 >= QUESTIONS.length ? 'Finish' : 'Next question',
      onNext: this.next,
      isComplete: complete,
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F5FF; }
    * { box-sizing: border-box; }
    a { color: #6C4FF6; text-decoration: none; }
    a:hover { color: #5539E0; }
  </style>
</helmet>

<div style="font-family: {{ bodyFont }}; background: #F7F5FF; color: #1E1B2E; min-height: 100vh; padding-bottom: 88px;">

  <div style="background: #6C4FF6; padding: 20px 24px;">
    <div style="max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 14px;">
      <a href="Course Roadmap.dc.html" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3L5 9L11 15" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div style="font-weight: 800; font-size: 18px; color: white; font-family: {{ headFont }};">{{ pageTitle }}</div>
    </div>
  </div>

  <div style="max-width: 640px; margin: 0 auto; padding: 28px 24px 0; display: flex; flex-direction: column; gap: 20px;">

    <div style="background: white; border-radius: 20px; padding: 24px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: #ECE8FB; display: flex; align-items: center; justify-content: center; font-family: {{ headFont }}; font-weight: 800; font-size: 22px; color: #6C4FF6; flex-shrink: 0;">{{ initials }}</div>
      <div>
        <div style="font-family: {{ headFont }}; font-weight: 800; font-size: 18px;">{{ name }}</div>
        <div style="font-size: 13px; color: #6B6580; font-weight: 600; margin-top: 2px;">{{ email }}</div>
      </div>
    </div>

    <div style="background: white; border-radius: 20px; padding: 8px;">
      <button onClick="{{ toggleLang }}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; background: none; border: none; padding: 16px; cursor: pointer; text-align: left; font-family: {{ bodyFont }};">
        <span style="font-size: 15px; font-weight: 700;">{{ languageLabel }}</span>
        <span style="font-size: 14px; font-weight: 700; color: #6C4FF6;">{{ langValue }}</span>
      </button>
      <div style="height: 1px; background: #ECE8FB; margin: 0 16px;"></div>
      <a href="Parent Dashboard.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 16px; font-size: 15px; font-weight: 700; color: #1E1B2E;">
        {{ parentLabel }}
        <span style="color: #B5AFD4;">›</span>
      </a>
      <div style="height: 1px; background: #ECE8FB; margin: 0 16px;"></div>
      <a href="Progress.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 16px; font-size: 15px; font-weight: 700; color: #1E1B2E;">
        {{ progressLabel }}
        <span style="color: #B5AFD4;">›</span>
      </a>
    </div>

    <div style="background: white; border-radius: 20px; padding: 8px;">
      <a href="Sign In.dc.html" style="display: block; padding: 16px; font-size: 15px; font-weight: 700; color: #E5484D;">{{ logoutLabel }}</a>
    </div>

  </div>

  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #ECE8FB; display: flex; justify-content: center; padding: 10px 0; z-index: 3;">
    <div style="max-width: 640px; width: 100%; display: flex; justify-content: space-around;">
      <a href="Course Roadmap.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 18px;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#B5AFD4" stroke-width="1.6"><path d="M10 2L2 9h2v9h5v-6h2v6h5V9h2z" fill="#B5AFD4" stroke="none"/></svg>
        <span style="font-size: 12px; font-weight: 600; color: #B5AFD4;">{{ homeLabel }}</span>
      </a>
      <a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 18px;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#B5AFD4" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><path d="M10 4.5A5.5 5.5 0 0 1 15.5 10" stroke="#6C4FF6"/></svg>
        <span style="font-size: 12px; font-weight: 600; color: #B5AFD4;">{{ progressTabLabel }}</span>
      </a>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: #ECE8FB; border-radius: 12px; padding: 8px 18px;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#6C4FF6" stroke-width="1.6"><circle cx="10" cy="6.5" r="3.2"/><path d="M3.5 17c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/></svg>
        <span style="font-size: 12px; font-weight: 700; color: #6C4FF6;">{{ profileTabLabel }}</span>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'en' };
  toggleLang = () => this.setState(s => ({ lang: s.lang === 'en' ? 'si' : 'en' }));

  renderVals() {
    const lang = this.state.lang;
    const isSi = lang === 'si';
    const bodyFont = isSi ? "'Noto Sans Sinhala', 'Inter', sans-serif" : "'Inter', sans-serif";
    const headFont = isSi ? "'Noto Sans Sinhala', 'Baloo 2', sans-serif" : "'Baloo 2', sans-serif";

    const copy = {
      en: {
        title: 'Profile', language: 'Language', parent: 'Parent Dashboard', progress: 'Your Progress',
        logout: 'Log out', home: 'Home', progressTab: 'Progress', profileTab: 'Profile',
      },
      si: {
        title: 'පැතිකඩ', language: 'භාෂාව', parent: 'මාපිය පුවරුව', progress: 'ඔබේ ප්‍රගතිය',
        logout: 'ඉවත් වන්න', home: 'මුල් පිටුව', progressTab: 'ප්‍රගතිය', profileTab: 'පැතිකඩ',
      },
    };
    const c = copy[lang];

    return {
      bodyFont, headFont, toggleLang: this.toggleLang,
      pageTitle: c.title,
      initials: 'AS', name: 'Amaya Silva', email: 'amaya.silva@example.com',
      languageLabel: c.language, langValue: isSi ? 'සිංහල' : 'English',
      parentLabel: c.parent, progressLabel: c.progress, logoutLabel: c.logout,
      homeLabel: c.home, progressTabLabel: c.progressTab, profileTabLabel: c.profileTab,
    };
  }
}

</script>
</body>
</html>

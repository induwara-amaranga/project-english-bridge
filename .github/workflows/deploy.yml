name: Deploy

# Every push to main that touches the app: re-run CI, release the API to
# Heroku and wait until it reports ready, then publish the frontend to
# Cloudflare Pages. Each job is gated on the previous one, so nothing
# untested ships, and the new frontend never goes live against an old API.
#
# One-time setup (Heroku app, Postgres, config vars, domains) is
# Englisher/infra/heroku-setup.sh. Secrets/variables this workflow needs:
#   secrets:   HEROKU_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#              VITE_GOOGLE_CLIENT_ID, VITE_FACEBOOK_APP_ID,
#              VITE_ADSENSE_CLIENT_ID, VITE_AD_SLOT_ROADMAP, VITE_AD_SLOT_LESSON_DONE
#   variables: HEROKU_APP_NAME, API_BASE_URL, CLOUDFLARE_PAGES_PROJECT
on:
  push:
    branches: [main]
    paths:
      - "Englisher/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  backend:
    name: Release API to Heroku
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      APP: ${{ vars.HEROKU_APP_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./Englisher/server
          platforms: linux/amd64
          push: true
          # Heroku's registry can only release a plain single-platform image;
          # buildx's default attestations turn the push into an OCI index.
          provenance: false
          sbom: false
          tags: registry.heroku.com/${{ vars.HEROKU_APP_NAME }}/web
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Platform API equivalent of `heroku container:release web`, so the
      # job doesn't depend on the Heroku CLI being on the runner.
      - name: Release
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          curl --fail-with-body -sS -X PATCH "https://api.heroku.com/apps/$APP/formation" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$IMAGE_ID\"}]}"

      # Fail the run, instead of shipping a frontend against a dead API, if
      # the new release isn't serving within ~3 minutes (Spring Boot + Flyway
      # boot plus Heroku's dyno restart).
      - name: Wait for readiness
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          for i in $(seq 1 36); do
            if curl -fsS "$API_BASE_URL/actuator/health/readiness" >/dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become ready — check: heroku logs --tail -a $APP" >&2
          exit 1

  frontend:
    name: Publish frontend to Cloudflare Pages
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: Englisher/frontend/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Englisher/frontend/app/package-lock.json

      - run: npm ci

      # Vite inlines VITE_* at build time. The OAuth/AdSense ids are public
      # identifiers, not secrets, but live in secrets to keep them out of logs
      # and forks.
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
          VITE_ADSENSE_CLIENT_ID: ${{ secrets.VITE_ADSENSE_CLIENT_ID }}
          VITE_AD_SLOT_ROADMAP: ${{ secrets.VITE_AD_SLOT_ROADMAP }}
          VITE_AD_SLOT_LESSON_DONE: ${{ secrets.VITE_AD_SLOT_LESSON_DONE }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Englisher/frontend/app
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

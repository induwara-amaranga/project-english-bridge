# Local development / all-in-one stack: PostgreSQL, the API itself, and a
# mail catcher — actually wired up for admin sign-in OTPs (OtpMailService),
# and standing by for the parent invitations once ParentLinkService.deliver()
# is wired to real email too.
#
# Prefer running the API from the IDE or `./mvnw spring-boot:run` while
# actively developing it — faster feedback than a rebuild — but `docker
# compose up` here brings up the whole backend stack in one shot too.
services:
  db:
    image: postgres:17-alpine
    container_name: englisher-db
    environment:
      POSTGRES_DB: englisher
      POSTGRES_USER: englisher
      POSTGRES_PASSWORD: englisher
    ports:
      - "5432:5432"
    volumes:
      - englisher-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englisher -d englisher"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The API. Built with maven:3.9.6-eclipse-temurin-21 (see Dockerfile) and run
  # under the `dev` profile so it comes up with a throwaway JWT secret and a
  # seeded admin account without any extra configuration.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: englisher-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ENGLISHER_DB_URL: jdbc:postgresql://db:5432/englisher
      ENGLISHER_DB_USER: englisher
      ENGLISHER_DB_PASSWORD: englisher
      # `mail`, not `localhost` — from inside this container, that's the
      # Mailpit service below, reachable by its compose service name.
      ENGLISHER_SMTP_HOST: mail
      ENGLISHER_SMTP_PORT: 1025
      # Where the seeded admin's sign-in OTP goes — see DataSeeder and
      # AuthProperties.adminOtpEmail. Falls back to ENGLISHER_ADMIN_EMAIL
      # itself if unset, which is fine here since Mailpit catches anything.
      ENGLISHER_ADMIN_OTP_EMAIL: ${ENGLISHER_ADMIN_OTP_EMAIL:-}
      # Optional — Google/Facebook sign-in stays disabled (503) until these
      # are set in your shell or a .env file next to this compose file.
      ENGLISHER_GOOGLE_CLIENT_ID: ${ENGLISHER_GOOGLE_CLIENT_ID:-}
      ENGLISHER_FACEBOOK_APP_ID: ${ENGLISHER_FACEBOOK_APP_ID:-}
      ENGLISHER_FACEBOOK_APP_SECRET: ${ENGLISHER_FACEBOOK_APP_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  # Catches admin sign-in OTPs and (eventually) parent invitation emails so
  # both flows can be exercised end to end without anything actually being
  # sent. Web UI on http://localhost:8025.
  mail:
    image: axllent/mailpit:latest
    container_name: englisher-mail
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  englisher-db-data:

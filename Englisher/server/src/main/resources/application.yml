spring:
  application:
    name: englisher-server
  datasource:
    url: ${ENGLISHER_DB_URL:jdbc:postgresql://localhost:5432/englisher}
    username: ${ENGLISHER_DB_USER:englisher}
    password: ${ENGLISHER_DB_PASSWORD:englisher}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. ddl-auto stays off so a mapping mistake fails
      # loudly against the real schema instead of silently altering it.`
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Timestamps go over the wire as ISO-8601 strings, because Progress
    # carries `lastActiveISO: string` and the React app calls new Date() on it.
    serialization:
      write-dates-as-timestamps: false
  mail:
    # Admin sign-in OTPs (AuthService/OtpMailService). Points at the Mailpit
    # container in dev (see docker-compose.yml) — nothing leaves the machine
    # unless ENGLISHER_SMTP_HOST is overridden to a real relay.
    host: ${ENGLISHER_SMTP_HOST:localhost}
    port: ${ENGLISHER_SMTP_PORT:1025}
    username: ${ENGLISHER_SMTP_USER:}
    password: ${ENGLISHER_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${ENGLISHER_SMTP_AUTH:false}
          starttls:
            enable: ${ENGLISHER_SMTP_STARTTLS:false}

server:
  port: ${ENGLISHER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

englisher:
  auth:
    jwt-secret: ${ENGLISHER_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    invite-ttl: 14d
    allowed-origins: ${ENGLISHER_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    cookie-secure: true
    cookie-same-site: Lax
    admin-email: ${ENGLISHER_ADMIN_EMAIL:admin@englisher.test}
    admin-password: ${ENGLISHER_ADMIN_PASSWORD:}
    admin-name: Course Admin
    # Where the seeded admin's sign-in OTP is delivered — see DataSeeder.
    # Blank falls back to admin-email itself.
    admin-otp-email: ${ENGLISHER_ADMIN_OTP_EMAIL:}
    mail-from: ${ENGLISHER_MAIL_FROM:no-reply@englisher.test}
  oauth:
    google-client-id: ${ENGLISHER_GOOGLE_CLIENT_ID:}
    facebook-app-id: ${ENGLISHER_FACEBOOK_APP_ID:}
    facebook-app-secret: ${ENGLISHER_FACEBOOK_APP_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    lk.englisher: INFO

# Integration-test profile. The datasource URL is injected by
# AbstractPostgresIT's @DynamicPropertySource, pointing at the embedded server.
englisher:
  auth:
    jwt-secret: test-only-signing-key-at-least-32-bytes-long
    cookie-secure: false
    # No admin password: DataSeeder deliberately skips the admin account rather
    # than provisioning a well-known one, and ApiFlowIT asserts that.
    admin-password: ""
    allowed-origins: http://localhost:5173

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  # Never actually dialled: AbstractPostgresIT mocks JavaMailSender so no test
  # opens a real SMTP connection. This host just has to be present for the
  # bean to exist before the mock replaces it.
  mail:
    host: localhost

management:
  health:
    # Actuator's mail health check looks for a concrete JavaMailSenderImpl
    # bean specifically; the mocked JavaMailSender interface doesn't satisfy
    # it ("Beans must not be empty") and the context fails to start without this.
    mail:
      enabled: false

logging:
  level:
    lk.englisher: INFO
    org.flywaydb: INFO

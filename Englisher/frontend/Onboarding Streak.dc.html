<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F5FF; }
    * { box-sizing: border-box; }
    a { color: #6C4FF6; text-decoration: none; }
  </style>
</helmet>

<div style="font-family: {{ bodyFont }}; background: #F7F5FF; color: #1E1B2E; min-height: 100vh; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 24px; max-width: 560px; margin: 0 auto; width: 100%;">
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #6C4FF6;"></div>
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #6C4FF6;"></div>
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #6C4FF6;"></div>
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #ECE8FB;"></div>
    <button onClick="{{ toggleLang }}" style="background: #ECE8FB; border: none; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 12px; cursor: pointer; flex-shrink: 0; color: #6C4FF6;">{{ langToggleLabel }}</button>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div style="max-width: 480px; width: 100%; text-align: center;">
      <h1 style="font-family: {{ headFont }}; font-weight: 800; font-size: 26px; margin: 0 0 8px;">{{ title }}</h1>
      <p style="font-size: 15px; color: #6B6580; font-weight: 600; margin: 0 0 28px; line-height: 1.5;">{{ subtitle }}</p>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <sc-for list="{{ goals }}" as="goal" hint-placeholder-count="4">
          <button onClick="{{ goal.onSelect }}" style="display: flex; align-items: center; text-align: left; min-height: 48px; background: {{ goal.bg }}; border: 1px solid {{ goal.border }}; border-radius: 20px; padding: 0 24px; cursor: pointer; font-family: {{ bodyFont }};">
            <span style="font-weight: 600; font-size: 13px; color: #6B6580;">{{ goal.label }}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="max-width: 480px; width: 100%; margin: 0 auto; padding: 0 24px 32px;">
    <a href="Onboarding Walkthrough.dc.html" style="display: block; text-align: center; background: #6C4FF6; color: white; border: none; border-radius: 999px; padding: 16px; font-weight: 700; font-size: 16px; box-shadow: 0 5px 0 #4B3AC7;">{{ continueLabel }}</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // This screen used to be a single on/off notification toggle. It is now a
  // streak-goal picker: the learner commits to a target run length, which is
  // what the streak on Progress / the Parent Dashboard is measured against.
  state = { lang: 'en', selected: 0 };
  toggleLang = () => this.setState(s => ({ lang: s.lang === 'en' ? 'si' : 'en' }));
  select = (i) => this.setState({ selected: i });

  renderVals() {
    const lang = this.state.lang;
    const isSi = lang === 'si';
    const bodyFont = isSi ? "'Noto Sans Sinhala', 'Inter', sans-serif" : "'Inter', sans-serif";
    const headFont = isSi ? "'Noto Sans Sinhala', 'Baloo 2', sans-serif" : "'Baloo 2', sans-serif";

    const copy = {
      en: {
        title: 'It can be difficult to stay focus',
        subtitle: 'Consistency beats intensity. Learning with a streak goal can take you a long way.',
        goals: [
          '7 Days - Great start!',
          '14 Days - You’re building a habit!',
          '30 Days - Incredible consistency!',
          '60 Days - You’re unstoppable!',
        ],
        continue: 'Continue',
      },
      si: {
        title: 'අවධානය පවත්වා ගැනීම අපහසු විය හැක',
        subtitle: 'අඛණ්ඩතාව තීව්‍රතාවයට වඩා වැදගත්. ලකුණු ඉලක්කයක් සමඟ ඉගෙනීම ඔබව බොහෝ දුරක් ගෙන යා හැක.',
        goals: [
          'දින 7 - හොඳ ආරම්භයක්!',
          'දින 14 - ඔබ පුරුද්දක් ගොඩනඟමින්!',
          'දින 30 - විශිෂ්ට අඛණ්ඩතාවක්!',
          'දින 60 - ඔබව නවතන්න බැහැ!',
        ],
        continue: 'ඉදිරියට',
      },
    };
    const c = copy[lang];
    const sel = this.state.selected;

    const goals = c.goals.map((label, i) => ({
      label,
      onSelect: () => this.select(i),
      bg: sel === i ? '#ECE8FB' : 'white',
      border: sel === i ? '#6C4FF6' : '#E4E0F5',
    }));

    return {
      bodyFont, headFont, goals,
      toggleLang: this.toggleLang, langToggleLabel: isSi ? 'EN' : 'සිං',
      title: c.title, subtitle: c.subtitle, continueLabel: c.continue,
    };
  }
}

</script>
</body>
</html>

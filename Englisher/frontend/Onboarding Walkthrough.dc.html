<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F5FF; }
    * { box-sizing: border-box; }
    a { color: #6C4FF6; text-decoration: none; }
  </style>
</helmet>

<div style="font-family: {{ bodyFont }}; background: #F7F5FF; color: #1E1B2E; min-height: 100vh; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 24px; max-width: 560px; margin: 0 auto; width: 100%;">
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #6C4FF6;"></div>
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #6C4FF6;"></div>
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #6C4FF6;"></div>
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #6C4FF6;"></div>
    <button onClick="{{ toggleLang }}" style="background: #ECE8FB; border: none; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 12px; cursor: pointer; flex-shrink: 0; color: #6C4FF6;">{{ langToggleLabel }}</button>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div style="max-width: 520px; width: 100%; text-align: center;">
      <h1 style="font-family: {{ headFont }}; font-weight: 800; font-size: 26px; margin: 0 0 28px;">{{ title }}</h1>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <sc-for list="{{ steps }}" as="step" hint-placeholder-count="3">
          <div style="display: flex; gap: 16px; text-align: left; background: white; border-radius: 18px; padding: 20px; align-items: flex-start;">
            <div style="font-size: 30px; flex-shrink: 0;">{{ step.emoji }}</div>
            <div>
              <div style="font-family: {{ headFont }}; font-weight: 800; font-size: 16px;">{{ step.title }}</div>
              <div style="font-size: 14px; color: #6B6580; font-weight: 600; margin-top: 4px; line-height: 1.4;">{{ step.desc }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="max-width: 480px; width: 100%; margin: 0 auto; padding: 0 24px 32px;">
    <a href="Placement Test.dc.html" style="display: block; text-align: center; background: #6C4FF6; color: white; border: none; border-radius: 999px; padding: 16px; font-weight: 700; font-size: 16px; box-shadow: 0 5px 0 #4B3AC7;">{{ startLabel }}</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'en' };
  toggleLang = () => this.setState(s => ({ lang: s.lang === 'en' ? 'si' : 'en' }));

  renderVals() {
    const lang = this.state.lang;
    const isSi = lang === 'si';
    const bodyFont = isSi ? "'Noto Sans Sinhala', 'Inter', sans-serif" : "'Inter', sans-serif";
    const headFont = isSi ? "'Noto Sans Sinhala', 'Baloo 2', sans-serif" : "'Baloo 2', sans-serif";

    const copy = {
      en: {
        title: 'How Englisher works',
        steps: [
          { emoji: '📖', title: 'Lessons', desc: 'Short explanations with examples in English and Sinhala.' },
          { emoji: '✏️', title: 'Exercises', desc: 'Practice right after each lesson, with instant feedback.' },
          { emoji: '📈', title: 'Progress', desc: 'Track your streak, XP, and course completion as you go.' },
        ],
        start: "Let's check your level",
      },
      si: {
        title: 'Englisher ක්‍රියා කරන ආකාරය',
        steps: [
          { emoji: '📖', title: 'පාඩම්', desc: 'ඉංග්‍රීසි සහ සිංහල උදාහරණ සමඟ කෙටි පැහැදිලි කිරීම්.' },
          { emoji: '✏️', title: 'අභ්‍යාස', desc: 'සෑම පාඩමකින් පසුව ම ක්ෂණික ප්‍රතිචාර සමඟ අභ්‍යාස කරන්න.' },
          { emoji: '📈', title: 'ප්‍රගතිය', desc: 'ඔබේ ලකුණ, XP සහ පාඩම් සම්පූර්ණ වීම නිරීක්ෂණය කරන්න.' },
        ],
        start: 'ඔබේ මට්ටම බලමු',
      },
    };
    const c = copy[lang];

    return {
      bodyFont, headFont, title: c.title, steps: c.steps, startLabel: c.start,
      toggleLang: this.toggleLang, langToggleLabel: isSi ? 'EN' : 'සිං',
    };
  }
}

</script>
</body>
</html>

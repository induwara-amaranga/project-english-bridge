<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F5FF; }
    * { box-sizing: border-box; }
    a { color: #6C4FF6; text-decoration: none; }
    a:hover { color: #5539E0; }
  </style>
</helmet>

<div style="font-family: 'Inter', sans-serif; background: #F7F5FF; color: #1E1B2E; min-height: 100vh; padding-bottom: 88px;">

  <div style="background: #6C4FF6; padding: 20px 24px;">
    <div style="max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 14px;">
      <a href="Course Roadmap.dc.html" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3L5 9L11 15" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div style="font-weight: 800; font-size: 18px; color: white; font-family: 'Baloo 2', sans-serif;">Your Progress</div>
    </div>
  </div>

  <div style="max-width: 640px; margin: 0 auto; padding: 28px 24px 0; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div style="background: white; border-radius: 20px; padding: 22px;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
          <div style="width: 30px; height: 30px; background: #FFB800; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);"></div>
        </div>
        <div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px;">{{ xpTotal }} XP total</div>
        <div style="font-size: 13px; color: #6B6580; font-weight: 600; margin-top: 4px;">Earned across {{ stagesStarted }} stages</div>
      </div>

      <div style="background: white; border-radius: 20px; padding: 22px;">
        <div style="margin-bottom: 10px;">
          <svg width="30" height="30" viewBox="0 0 16 16" fill="#FF6B4A"><path d="M8 1C8 1 5 5 5 9C5 11.5 6.5 13.5 8 13.5C9.5 13.5 11 11.5 11 9C11 7.5 10.3 6.5 9.7 6.5C9.7 8 9 9 8.3 9C9 6.5 8 4.5 8 1Z"/></svg>
        </div>
        <div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px;">{{ streakLabel }}</div>
        <div style="font-size: 13px; color: #6B6580; font-weight: 600; margin-top: 4px;">{{ streakSubtext }}</div>
      </div>
    </div>

    <div style="background: white; border-radius: 20px; padding: 24px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px;">
        <div style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px;">{{ overallLabel }}</div>
      </div>
      <div style="width: 100%; height: 10px; border-radius: 999px; background: #ECE8FB; overflow: hidden; margin: 10px 0;">
        <div style="height: 100%; border-radius: 999px; background: #6C4FF6; width: {{ overallPct }}%;"></div>
      </div>
      <div style="font-size: 13px; color: #6B6580; font-weight: 600;">{{ overallSubtext }}</div>
    </div>

    <div style="background: white; border-radius: 20px; padding: 24px;">
      <div style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 13px; color: #6C4FF6; margin-bottom: 16px;">STAGE BREAKDOWN</div>
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <sc-for list="{{ stageRows }}" as="row" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 14px;">
            <div style="width: 34px; height: 34px; border-radius: 50%; background: {{ row.badgeBg }}; color: white; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 14px; flex-shrink: 0;">{{ row.n }}</div>
            <div style="flex: 1;">
              <div style="font-size: 14px; font-weight: 700; margin-bottom: 5px;">{{ row.title }}</div>
              <div style="width: 100%; height: 6px; border-radius: 999px; background: #ECE8FB; overflow: hidden;">
                <div style="height: 100%; border-radius: 999px; background: {{ row.barColor }}; width: {{ row.pct }}%;"></div>
              </div>
            </div>
            <div style="font-size: 13px; font-weight: 700; color: {{ row.labelColor }}; width: 90px; text-align: right; flex-shrink: 0;">{{ row.label }}</div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #ECE8FB; display: flex; justify-content: center; padding: 10px 0; z-index: 3;">
    <div style="max-width: 640px; width: 100%; display: flex; justify-content: space-around;">
      <a href="Course Roadmap.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 18px;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#B5AFD4" stroke-width="1.6"><path d="M10 2L2 9h2v9h5v-6h2v6h5V9h2z" fill="#B5AFD4" stroke="none"/></svg>
        <span style="font-size: 12px; font-weight: 600; color: #B5AFD4;">Home</span>
      </a>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: #ECE8FB; border-radius: 12px; padding: 8px 18px;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#6C4FF6" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><path d="M10 4.5A5.5 5.5 0 0 1 15.5 10"/></svg>
        <span style="font-size: 12px; font-weight: 700; color: #6C4FF6;">Progress</span>
      </div>
      <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 18px;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#B5AFD4" stroke-width="1.6"><circle cx="10" cy="6.5" r="3.2"/><path d="M3.5 17c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/></svg>
        <span style="font-size: 12px; font-weight: 600; color: #B5AFD4;">Profile</span>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const STAGES = [
  'Tenses', 'Complex Sentences', 'Adjectives, Adverbs & Prepositions', 'Passive Voice',
  'Sinhala–English Translation', 'Guided Essays', 'Solo Essays', 'Formal Letters',
];
const DEMO_XP = 240;
const DEMO_STREAK = 7;
const CURRENT_STAGE = 2;
const CURRENT_PCT = 60;

class Component extends DCLogic {
  renderVals() {
    const completedCount = CURRENT_STAGE - 1;
    const overallPct = Math.round(((completedCount + CURRENT_PCT / 100) / STAGES.length) * 100);
    const stagesToGo = STAGES.length - completedCount;

    const stageRows = STAGES.map((title, i) => {
      const n = i + 1;
      const isCompleted = n < CURRENT_STAGE;
      const isCurrent = n === CURRENT_STAGE;
      let pct, label, labelColor, barColor, badgeBg;
      if (isCompleted) { pct = 100; label = '100% complete'; labelColor = '#3E8E5B'; barColor = '#3ECF6E'; badgeBg = '#3ECF6E'; }
      else if (isCurrent) { pct = CURRENT_PCT; label = `${CURRENT_PCT}% complete`; labelColor = '#6C4FF6'; barColor = '#6C4FF6'; badgeBg = '#6C4FF6'; }
      else { pct = 0; label = 'Locked'; labelColor = '#B5AFD4'; barColor = '#ECE8FB'; badgeBg = '#D8D2F0'; }
      return { n, title, pct, label, labelColor, barColor, badgeBg };
    });

    return {
      xpTotal: DEMO_XP.toLocaleString(),
      stagesStarted: CURRENT_STAGE,
      streakLabel: `${DEMO_STREAK}-day streak`,
      streakSubtext: 'Keep it going — come back tomorrow',
      overallLabel: `${completedCount} of ${STAGES.length} stages complete — ${overallPct}% of the course`,
      overallPct,
      overallSubtext: `${stagesToGo} stages to go until your certificate`,
      stageRows,
    };
  }
}
</script>
</body>
</html>

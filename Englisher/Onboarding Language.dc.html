<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F5FF; }
    * { box-sizing: border-box; }
    a { color: #6C4FF6; text-decoration: none; }
  </style>
</helmet>

<div style="font-family: {{ bodyFont }}; background: #F7F5FF; color: #1E1B2E; min-height: 100vh; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 24px; max-width: 560px; margin: 0 auto; width: 100%;">
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #6C4FF6;"></div>
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #6C4FF6;"></div>
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #ECE8FB;"></div>
    <div style="flex: 1; height: 8px; border-radius: 999px; background: #ECE8FB;"></div>
    <button onClick="{{ toggleLang }}" style="background: #ECE8FB; border: none; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 12px; cursor: pointer; flex-shrink: 0; color: #6C4FF6;">{{ langToggleLabel }}</button>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div style="max-width: 480px; width: 100%; text-align: center;">
      <div style="font-size: 44px; margin-bottom: 8px;">🌐</div>
      <h1 style="font-family: {{ headFont }}; font-weight: 800; font-size: 26px; margin: 0 0 8px;">{{ title }}</h1>
      <p style="font-size: 15px; color: #6B6580; font-weight: 600; margin: 0 0 28px;">{{ subtitle }}</p>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <sc-for list="{{ options }}" as="opt" hint-placeholder-count="3">
          <button onClick="{{ opt.onSelect }}" style="display: flex; align-items: center; gap: 14px; text-align: left; background: {{ opt.bg }}; border: 2px solid {{ opt.border }}; border-radius: 16px; padding: 18px 20px; cursor: pointer; font-family: {{ opt.font }};">
            <span style="font-weight: 700; font-size: 17px;">{{ opt.label }}</span>
            <span style="margin-left: auto; font-size: 13px; color: #6B6580; font-weight: 600;">{{ opt.sub }}</span>
          </button>
        </sc-for>
      </div>
      <p style="font-size: 13px; color: #A8A0C7; font-weight: 600; margin-top: 18px;">{{ switchNote }}</p>
    </div>
  </div>

  <div style="max-width: 480px; width: 100%; margin: 0 auto; padding: 0 24px 32px;">
    <a href="Onboarding Reminders.dc.html" style="display: block; text-align: center; background: #6C4FF6; color: white; border: none; border-radius: 999px; padding: 16px; font-weight: 700; font-size: 16px; box-shadow: 0 5px 0 #4B3AC7;">{{ continueLabel }}</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // `lang` is the UI language (the toggle in the progress row); `choice` is the
  // course language the learner is picking on this screen. They were the same
  // field before the third "English+Sinhala" option existed, which made choosing
  // Sinhala silently retranslate the page mid-decision.
  state = { lang: 'en', choice: 'en' };
  toggleLang = () => this.setState(s => ({ lang: s.lang === 'en' ? 'si' : 'en' }));
  select = (key) => this.setState({ choice: key });

  renderVals() {
    const lang = this.state.lang;
    const isSi = lang === 'si';
    const bodyFont = isSi ? "'Noto Sans Sinhala', 'Inter', sans-serif" : "'Inter', sans-serif";
    const headFont = isSi ? "'Noto Sans Sinhala', 'Baloo 2', sans-serif" : "'Baloo 2', sans-serif";

    const copy = {
      en: {
        title: 'Pick your language',
        subtitle: "We'll use this for explanations and instructions.",
        switch: 'You can switch language choice anytime.',
        continue: 'Continue',
      },
      si: {
        title: 'ඔබේ භාෂාව තෝරන්න',
        subtitle: 'පැහැදිලි කිරීම් සහ උපදෙස් සඳහා අපි මෙය භාවිතා කරමු.',
        switch: 'ඔබට ඕනෑම වේලාවක භාෂා තේරීම වෙනස් කළ හැක.',
        continue: 'ඉදිරියට',
      },
    };
    const c = copy[lang];

    // Each option is labelled in its own script regardless of the UI language,
    // so these are deliberately not part of the `copy` deck above.
    const OPTIONS = [
      { key: 'en',   label: 'English',      sub: 'lessons + explanations in English', font: "'Inter', sans-serif" },
      { key: 'si',   label: 'සිංහල',        sub: 'පැහැදිලි කිරීම් සිංහලෙන්',           font: "'Noto Sans Sinhala', sans-serif" },
      { key: 'both', label: 'English+සිංහල', sub: 'සිංහල උපසිරැසි සමඟ ඉංග්‍රීසි',       font: "'Inter', 'Noto Sans Sinhala', sans-serif" },
    ];
    const options = OPTIONS.map(o => ({
      label: o.label, sub: o.sub, font: o.font,
      onSelect: () => this.select(o.key),
      bg: this.state.choice === o.key ? '#ECE8FB' : 'white',
      border: this.state.choice === o.key ? '#6C4FF6' : '#E4E0F5',
    }));

    return {
      bodyFont, headFont, options,
      toggleLang: this.toggleLang, langToggleLabel: isSi ? 'EN' : 'සිං',
      title: c.title, subtitle: c.subtitle, switchNote: c.switch, continueLabel: c.continue,
    };
  }
}

</script>
</body>
</html>
